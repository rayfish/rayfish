[package]
name = "ray-apple"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Apple platform bridge for the Rayfish mesh core"
license = "MPL-2.0"
publish = false

[lib]
name = "ray_apple"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rayfish = { path = "..", default-features = false, features = ["desktop"] }
anyhow = "1"
# Same crate and version as `rayfish`, for `EndpointId`.
iroh = { version = "1.3", features = ["metrics", "unstable-custom-transports", "unstable-net-report"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uniffi = { version = "0.29", features = ["cli"] }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
