[package]
name = "ray-apple"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Apple platform bridge for the Rayfish mesh core"
license = "MPL-2.0"
publish = false

[lib]
name = "ray_apple"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rayfish = { path = "..", default-features = false }
anyhow = "1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
