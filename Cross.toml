# Pin the Linux build container to Ubuntu 22.04 (glibc 2.35) instead of cross's
# default `:main` image (Ubuntu 24.04, glibc 2.39). A 2.39-linked binary won't
# start on our older Scaleway hosts (`GLIBC_2.39 not found`); 22.04 is the newest
# Ubuntu they run and its binaries are forward-compatible with newer hosts.
# See cross/Dockerfile.gnu.
[target.x86_64-unknown-linux-gnu]
dockerfile = "cross/Dockerfile.gnu"

# The Android targets build the same core the app loads (`just android-check`),
# so an Android-only compile error is caught without an NDK on the machine. The
# stock 0.2.5 images cannot link Rust's android std; see cross/Dockerfile.android.
[target.aarch64-linux-android]
dockerfile = "cross/Dockerfile.android"

[target.x86_64-linux-android]
dockerfile = "cross/Dockerfile.android"
