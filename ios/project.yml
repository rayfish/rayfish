name: Rayfish
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.5.10"
    CURRENT_PROJECT_VERSION: "1"
    # Shared with Android (android/app/build.gradle.kts). Not a secret: it only
    # authorizes sending events to the project. Empty turns crash reporting off.
    # The just recipes pass the commit.
    RAYFISH_SENTRY_DSN: "https://3ace3eb4551a022cfd59fabe5b9f9c7e@o4511671603625984.ingest.de.sentry.io/4511671605198928"
    RAYFISH_GIT_SHA: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Generated"
    SWIFT_INCLUDE_PATHS:
      - "$(SRCROOT)/Generated"
    OTHER_SWIFT_FLAGS:
      - "-Xcc"
      - "-fmodule-map-file=$(SRCROOT)/Generated/ray_mobileFFI.modulemap"
    RUST_LIB_iphonesimulator: "$(SRCROOT)/../target/aarch64-apple-ios-sim/release/libray_mobile.a"
    RUST_LIB_iphoneos: "$(SRCROOT)/../target/aarch64-apple-ios/release/libray_mobile.a"
    OTHER_LDFLAGS:
      - "$(RUST_LIB_$(PLATFORM_NAME))"
      - "-framework"
      - "SystemConfiguration"
      - "-framework"
      - "Security"
      - "-lresolv"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.29.2
targets:
  Rayfish:
    type: application
    platform: iOS
    sources:
      - path: Rayfish
      - path: Shared
      - path: ../macos/Shared/ProviderReply.swift
      - path: Controls/SetTunnelIntent.swift
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.rayfish.ios
        PRODUCT_NAME: Rayfish
        INFOPLIST_FILE: Support/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RayfishTunnel
        embed: true
      - target: RayfishControls
        embed: true
      - package: Sentry
  RayfishTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: RayfishTunnel
      - path: Shared
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.rayfish.ios.tunnel
        PRODUCT_NAME: RayfishTunnel
        INFOPLIST_FILE: Support/Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: NetworkExtension.framework
      - package: Sentry
    preBuildScripts:
      - name: Build the Rust core
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
  RayfishControls:
    type: app-extension
    platform: iOS
    # Controls need iOS 18; on 17 the app runs without this extension.
    deploymentTarget: "18.0"
    sources:
      - path: Controls
      - path: Shared/VPNPreferences.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.rayfish.ios.controls
        PRODUCT_NAME: RayfishControls
        INFOPLIST_FILE: Support/Controls-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Controls.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        # No Rust core here.
        OTHER_LDFLAGS: []
        OTHER_SWIFT_FLAGS: []
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  RayfishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.rayfish.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Rayfish
        OTHER_LDFLAGS: []
        OTHER_SWIFT_FLAGS: []
    dependencies:
      - target: Rayfish
schemes:
  Rayfish:
    build:
      targets:
        Rayfish: all
    test:
      targets:
        - RayfishUITests
