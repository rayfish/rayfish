[package]
name = "ray-windows"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
publish = false

[[bin]]
name = "rayfish-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ray-proto = { path = "../ray-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.25.1", default-features = false, features = ["muda-common-controls-v6"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
