[package]
name = "ray-windows"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
publish = false

[[bin]]
name = "rayfish-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ray-proto = { path = "../ray-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wgpu = { version = "27", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["muda-common-controls-v6"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
