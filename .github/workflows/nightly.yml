name: Nightly

# Rolling pre-release built from every push to master. Moves the `nightly` tag
# to the new commit, recreates the `nightly` pre-release, and overwrites its
# Linux, macOS, and Windows CLI and daemon binaries. Apps (Android, iOS, the
# macOS app) and desktop installers ship only with versioned releases.
# `ray update --nightly` compares binary checksums.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Avoid two master pushes racing to move the tag / clobber assets.
concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  roll-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so git-cliff can list commits since last stable.
          fetch-depth: 0

      - name: Move the nightly tag to this commit
        id: meta
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -f nightly
          git push -f origin nightly

      # Changes landed since the last stable vX.Y.Z (the `nightly` tag is not a
      # release boundary per cliff.toml's tag_pattern).
      - name: Generate changes-since-stable
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create / refresh the nightly pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: nightly (${{ steps.meta.outputs.sha }})
          body: |
            Rolling nightly built from master @ ${{ steps.meta.outputs.sha }}. Install with `ray update --nightly`.

            ## Changes since the last stable release
            ${{ steps.notes.outputs.content }}
          prerelease: true

  build:
    needs: roll-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            name: ray-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            name: ray-linux-aarch64
          # Static builds: one binary that runs on any Linux regardless of glibc
          # version. Deps are musl-clean (ring + hickory, no C/dlopen deps).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            name: ray-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            name: ray-linux-aarch64-musl
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: ray-macos-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            name: ray-macos-x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc, needed for ring's C stubs when linking the static musl target.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Per-target key, matching release.yml (which is also what lets the two
      # workflows share one cache per target). rust-cache's key carries the
      # runner's os and arch but not the target triple, so the legs that share a
      # runner (both macOS targets, gnu and musl on each Linux arch) would
      # otherwise land on one key: whichever saved first serves the pair, and its
      # sibling restores a target dir with nothing for its own triple and
      # rebuilds every dependency, every run.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package for release
        run: |
          BINARY=target/${{ matrix.target }}/release/ray
          cp "$BINARY" ${{ matrix.name }}
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      - name: Upload nightly assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  windows:
    needs: roll-tag
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-x86_64-pc-windows-msvc"
          cache-on-failure: true

      - name: Build CLI and daemon
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --features desktop --bin ray

      - name: Package for release
        shell: pwsh
        run: |
          $asset = 'ray-windows-x86_64.exe'
          Copy-Item target/x86_64-pc-windows-msvc/release/ray.exe $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii

      - name: Upload Windows nightly assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          files: |
            ray-windows-x86_64.exe
            ray-windows-x86_64.exe.sha256

  # Windows nightlies are CLI/daemon binaries only. The x86_64 desktop app and
  # MSI are stable-release artifacts.
  windows-arm64:
    needs: roll-tag
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-aarch64-pc-windows-msvc"
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      # `<digest>  <name>`, matching what sha256sum writes on the other legs;
      # the updater reads the first whitespace-separated field.
      - name: Package for release
        shell: pwsh
        run: |
          $asset = 'ray-windows-aarch64.exe'
          Copy-Item target/aarch64-pc-windows-msvc/release/ray.exe $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii

      - name: Upload Windows ARM64 nightly assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          files: |
            ray-windows-aarch64.exe
            ray-windows-aarch64.exe.sha256
