name: CI

on:
  push:
    branches:
      - master
  # `labeled` so applying the `windows-packaging` label below starts a run on
  # its own, without waiting for another push.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-x86_64-unknown-linux-gnu"
          cache-on-failure: true

      # `--workspace`: ray-proto and ray-mobile are members, and a root-package
      # build never compiles their tests, so one of them had already gone stale.
      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Same gap the Android job closes, for the other platform whose code no Linux
  # build compiles: the TUN/route/DNS backends are per-OS `cfg` branches, and
  # macOS was only ever built on release, where a break costs a failed tag.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-aarch64-apple-darwin"
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The APK is built on release, which is too late: the Android half of the tree
  # is `#[cfg(target_os = "android")]` Rust plus generated Kotlin bindings, and
  # neither is compiled by the job above, so a PR could go green and break the
  # tag build. This is the cheap version of that: no APK, no release link, no NDK
  # download (the runner ships one), just the two things that actually broke.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-aarch64-linux-android"
          cache-on-failure: true

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The Android-only code paths (the VpnService TUN) compile nowhere else.
      - name: Check the Android target
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a check -p ray-mobile --locked

      - name: Regenerate the UniFFI bindings
        run: |
          cargo build -p ray-mobile
          cargo run -p ray-mobile --bin uniffi-bindgen -- generate \
            --library target/debug/libray_mobile.so \
            --language kotlin \
            --out-dir android/app/src/main/java

      # A stale committed copy means the app compiles here and not from a fresh
      # checkout of the same commit, so it is a failure, not a fixup.
      - name: Bindings are up to date
        run: git diff --exit-code android/app/src/main/java/uniffi/ray_mobile/ray_mobile.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `-x cargoNdkBuild` skips the native cross-build: the .so is not linked
      # into anything here, and the step above already compiled that code.
      - name: Compile the app
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin -x cargoNdkBuild

  # Same gap the macOS and Android jobs close, for the third platform whose code
  # no Linux build compiles: the TUN/route/DNS backends are per-OS `cfg`
  # branches, and the service wrapper is Windows-only.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-x86_64-pc-windows-msvc"
          cache-on-failure: true

      - name: Cross-target compile
        run: cargo check --locked --target x86_64-pc-windows-msvc --features desktop --bin ray

      - name: Host regression tests
        run: cargo test --workspace --locked

      - name: Windows contract tests
        run: cargo test --test windows_contracts --locked

      - name: Clippy quality gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # install.ps1 is only ever run by a user piping it into iex, so a syntax
      # error in it reaches them and nothing else. This is the only Windows
      # shell in the tree that can parse it.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "install.ps1 has $($errors.Count) parse error(s)."
          }
          Write-Host 'install.ps1 parses clean.'

  # Windows on ARM is its own target, not a variant of the x86_64 one: its C
  # dependencies (ring, blake3) select different sources there, so a green
  # x86_64 job says nothing about it. Built natively on `windows-11-arm`, which
  # is free for public repositories. Cross-compiling the target from Linux works
  # but needs an out-of-tree clang/lld toolchain, because ring forces the GNU
  # clang driver on Windows/AArch64 while the MSVC CRT ships NEON headers clang
  # cannot use.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-aarch64-pc-windows-msvc"
          cache-on-failure: true

      - name: Build ray.exe
        run: cargo build --locked --release --target aarch64-pc-windows-msvc --features desktop --bin ray

      - name: Windows contract tests
        run: cargo test --test windows_contracts --locked

      # Unsigned, like the MSI below; signing happens in release.yml, on a tag.
      - name: Upload ray.exe
        uses: actions/upload-artifact@v4
        with:
          name: ray-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ray.exe
          if-no-files-found: error

  # Half an hour of Windows runner for an installer nobody asked for, so it is
  # opt-in on pull requests: label one `windows-packaging` to get an MSI. A
  # label and not a configuration variable because `vars` is empty in a run
  # triggered by a pull request from a fork, which is where the port arrived
  # from; labels ride in the event payload and are readable there.
  windows-package:
    if: ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'windows-packaging') }}
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-package-x86_64-pc-windows-msvc"
          cache-on-failure: true

      - name: Install WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX candle.exe was not found after installation.'
          }

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build MSI and sidecars
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'rayfish' | Select-Object -First 1).version
          ./scripts/build-windows-msi.ps1 -Version $version -ReleaseIdentity $version -Channel stable -OutputPath "$env:RUNNER_TEMP\ray-windows-x86_64.msi"

      # Unsigned on purpose. This job runs on pull requests, including from
      # forks, which cannot see the signing secrets. Signing happens in
      # release.yml, on a tag.
      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ray-windows-x86_64-msi
          path: ${{ runner.temp }}/ray-windows-x86_64.msi*
          if-no-files-found: error
