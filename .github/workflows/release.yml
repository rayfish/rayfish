name: Release

# Continuous releases: pushing a tag like `v0.1.0` cuts a release with
# Linux, macOS, Android, and Windows assets. Can also be run manually from the
# Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.extract_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so git-cliff can diff against the previous tag.
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "${{ steps.extract_version.outputs.tag }}" -m "Release ${{ steps.extract_version.outputs.tag }}" 2>/dev/null || true
          git push origin "${{ steps.extract_version.outputs.tag }}" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Grouped changelog for this tag (since the previous vX.Y.Z) + a compare
      # link, rendered from the conventional commit messages by cliff.toml.
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest (not --current): pick the newest tag matching cliff.toml's
          # tag_pattern from the full timeline, instead of relying on "the tag at
          # HEAD". On a tag-push the runner checks out a detached HEAD and the
          # rolling `nightly` tag also sits on the commit, which breaks
          # --current's HEAD-tag detection ("No tag exists for the current commit").
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: ${{ steps.extract_version.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.tag, '-') }}

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            name: ray-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            name: ray-linux-aarch64
          # Static builds: one binary that runs on any Linux regardless of glibc
          # version. Deps are musl-clean (ring + hickory, no C/dlopen deps).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            name: ray-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            name: ray-linux-aarch64-musl
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: ray-macos-aarch64
          - target: x86_64-apple-darwin
            # Cross-compiled on Apple Silicon (universal SDK); macos-13 Intel
            # runners are being retired and leave the job queued indefinitely.
            runner: macos-latest
            name: ray-macos-x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc, needed for ring's C stubs when linking the static musl target.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Per-target key: the two macOS targets share a runner, so a single
      # shared-key would make them overwrite each other's target dir cache.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package for release
        run: |
          BINARY=target/${{ matrix.target }}/release/ray
          cp "$BINARY" ${{ matrix.name }}
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
      # SignPath fetches the unsigned MSI back out as a workflow artifact.
      actions: read
    env:
      # A step-level `if` cannot read the secrets context, so the token comes
      # through the environment instead. Empty until SignPath is set up, and
      # that is what keeps the unsigned release building in the meantime.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-x86_64-pc-windows-msvc"
          cache-on-failure: true

      - name: Install WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX candle.exe was not found after installation.'
          }

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build Windows MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG.TrimStart('v')
          $version = ($tag -split '-', 2)[0]
          ./scripts/build-windows-msi.ps1 -Version $version -ReleaseIdentity $tag -Channel stable -OutputPath "$env:RUNNER_TEMP\ray-windows-x86_64.msi"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_IDENTITY=$tag"

      # SignPath signs out of band. The unsigned MSI goes up as a workflow
      # artifact, SignPath signs the ray.exe inside it and then the MSI itself,
      # and the signed file comes back down. The three steps skip together when
      # the token is absent, so a release still builds before the certificate
      # exists; the assets are simply unsigned, as they are today.
      - name: Upload unsigned MSI for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: ray-windows-x86_64-msi-unsigned
          path: ${{ runner.temp }}/ray-windows-x86_64.msi
          if-no-files-found: error
          # Only SignPath needs it. Keeping it around would leave an unsigned
          # installer sitting on the release run for anyone to download.
          retention-days: 1

      - name: Sign MSI
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed

      - name: Verify signature and rehash
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\ray-windows-x86_64.msi"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\signed\ray-windows-x86_64.msi" -Destination $msi -Force
          # Valid, not merely signed: a release certificate has to chain to a
          # trusted root, and anything less would ship a warning to every user.
          $signature = Get-AuthenticodeSignature -FilePath $msi
          if ($signature.Status -ne 'Valid') {
            throw "Signed MSI did not verify: $($signature.Status)."
          }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
          ./scripts/write-msi-sidecars.ps1 -MsiPath $msi -ReleaseIdentity $env:RELEASE_IDENTITY

      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            ${{ runner.temp }}/ray-windows-x86_64.msi
            ${{ runner.temp }}/ray-windows-x86_64.msi.sha256
            ${{ runner.temp }}/ray-windows-x86_64.msi.version

  # No MSI and no signing on this leg. build-windows-msi.ps1 is x86_64 only (it
  # pins the amd64 Wintun), and the SignPath artifact configuration describes an
  # MSI, so ARM64 ships the bare exe the way the Linux and macOS binaries do.
  # install.ps1 fetches the matching Wintun DLL to sit beside it.
  windows-arm64:
    needs: create-release
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-aarch64-pc-windows-msvc"
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      # `<digest>  <name>`, matching what sha256sum writes on the other legs;
      # the updater reads the first whitespace-separated field.
      - name: Package for release
        shell: pwsh
        run: |
          $asset = 'ray-windows-aarch64.exe'
          Copy-Item target/aarch64-pc-windows-msvc/release/ray.exe $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii

      - name: Upload Windows ARM64 release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            ray-windows-aarch64.exe
            ray-windows-aarch64.exe.sha256

  android:
    needs: create-release
    # 24.04 (glibc 2.39): the prebuilt cargo-ndk from install-action is linked
    # against glibc 2.39 and won't load on 22.04 (glibc 2.35). Safe here because
    # this job's output is Android-target (bionic .so + APK), so the host glibc
    # never becomes an end-user floor the way it does for the desktop binaries.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-android"
          cache-on-failure: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Caches ~/.gradle/caches + ~/.gradle/wrapper (keyed on the Gradle
          # build files) so downloaded dependencies survive between runs.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The NDK is ~1GB; cache it so we download it once per version instead of
      # on every run. sdkmanager below is a no-op on a cache hit.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018

      # Prebuilt binary via install-action instead of `cargo install`, which
      # would compile cargo-ndk from source on every run.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Gradle's cargoNdkBuild task only rebuilds the .so; the Kotlin bindings
      # are generated here so the checked-in copy can never drift from the APK.
      - name: Generate UniFFI bindings
        run: |
          cargo build -p ray-mobile
          cargo run -p ray-mobile --bin uniffi-bindgen -- generate \
            --library target/debug/libray_mobile.so \
            --language kotlin \
            --out-dir android/app/src/main/java

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # Debug-signed for now (installable by anyone) since there is no release
      # keystore yet. Swap to a signed assembleRelease once one exists.
      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rayfish-android.apk
          sha256sum rayfish-android.apk > rayfish-android.apk.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            rayfish-android.apk
            rayfish-android.apk.sha256
