name: Windows test installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare diagnostic sanitizer
        if: always()
        shell: pwsh
        run: |
          @'
          function ConvertTo-SafeDiagnostic {
            param([Parameter(ValueFromPipeline=$true)][AllowEmptyString()][string]$Text)
            process {
              $text = [regex]::Replace($Text, '\x1B\[[0-?]*[ -/]*[@-~]', '')
              $roots = @(
                @{Value=$env:GITHUB_WORKSPACE; Label='<workspace>'},
                @{Value=$env:RUNNER_TEMP; Label='<temp>'},
                @{Value=$env:RUNNER_WORKSPACE; Label='<runner-workspace>'},
                @{Value=$env:USERPROFILE; Label='<user-profile>'},
                @{Value=(Join-Path $env:WINDIR 'System32\config\systemprofile'); Label='<service-profile>'}
              )
              foreach ($root in ($roots | Sort-Object { $_.Value.Length } -Descending)) {
                if (-not $root.Value) { continue }
                foreach ($value in @($root.Value, $root.Value.Replace('\', '/'))) {
                  $text = [regex]::Replace($text, [regex]::Escape($value), $root.Label, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
                }
              }
              foreach ($identity in @(@{Value=$env:COMPUTERNAME; Label='<host>'}, @{Value=$env:USERNAME; Label='<user>'})) {
                if ($identity.Value) {
                  $pattern = '(?<![\w-])' + [regex]::Escape($identity.Value) + '(?![\w-])'
                  $text = [regex]::Replace($text, $pattern, $identity.Label, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
                }
              }
              $text = [regex]::Replace($text, '(?<!\w)(?:[0-9a-f]{0,4}:){2,}[0-9a-f:.]*(?:%[\w.-]+)?(?!\w)', [Text.RegularExpressions.MatchEvaluator]{
                param($candidate)
                $address = $null
                $value = $candidate.Value.Split('%')[0]
                if ([Net.IPAddress]::TryParse($value, [ref]$address) -and $address.AddressFamily -eq [Net.Sockets.AddressFamily]::InterNetworkV6) { return '<ipv6>' }
                if ($value.EndsWith(':') -and [Net.IPAddress]::TryParse($value.Substring(0, $value.Length - 1), [ref]$address) -and $address.AddressFamily -eq [Net.Sockets.AddressFamily]::InterNetworkV6) { return '<ipv6>:' }
                return $candidate.Value
              }, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
              $octet = '(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)'
              $text = [regex]::Replace($text, "(?<![\w.])$octet(?:\.$octet){3}(?!\w|\.\d)", '<ipv4>')
              [regex]::Replace($text, '(\[<ipv6>\]|<ipv[46]>)(?::\d{1,5})?', [Text.RegularExpressions.MatchEvaluator]{
                param($candidate)
                if ($candidate.Value.Contains('<ipv6>')) { return '<ipv6>' }
                return '<ipv4>'
              })
            }
          }
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'safe-diagnostics.ps1')
          . (Join-Path $env:RUNNER_TEMP 'safe-diagnostics.ps1')
          $v4 = [Net.IPAddress]::Loopback.ToString()
          $v6 = [Net.IPAddress]::IPv6Loopback.ToString()
          $sample = "2026-01-02T03:04:05Z ipv4=$v4 ipv6=[$v6]:1234 UnexpectedEof ExitCode=1067"
          $expected = '2026-01-02T03:04:05Z ipv4=<ipv4> ipv6=<ipv6> UnexpectedEof ExitCode=1067'
          if ((ConvertTo-SafeDiagnostic $sample) -ne $expected) { throw 'Diagnostic address redaction failed.' }
          foreach ($value in @($env:COMPUTERNAME, $env:USERNAME, $env:USERPROFILE, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            if ($value -and (ConvertTo-SafeDiagnostic $value) -eq $value) { throw 'Diagnostic identity or path redaction failed.' }
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-package-x86_64-pc-windows-msvc"
          save-if: 'false'

      - name: Install WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX candle.exe was not found after installation.'
          }

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Validate installer definition
        shell: pwsh
        run: |
          candle.exe -nologo -arch x64 "-dCargoTargetBinDir=$env:RUNNER_TEMP" -out "$env:RUNNER_TEMP\installer-check.wixobj" wix/main.wxs
          if ($LASTEXITCODE -ne 0) { throw 'The installer definition did not compile.' }

      - name: Test Windows desktop behavior
        run: cargo test -q -p ray-windows --locked --target x86_64-pc-windows-msvc

      - name: Build test MSI
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'rayfish' | Select-Object -First 1).version
          ./scripts/build-windows-msi.ps1 -Version $version -ReleaseIdentity $version -Channel stable -OutputPath "$env:RUNNER_TEMP\ray-windows-x86_64.msi"

      - name: Check packaged shortcuts
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase("$env:RUNNER_TEMP\ray-windows-x86_64.msi", 0)
          $view = $database.OpenView('SELECT `Shortcut`, `Target`, `Icon_` FROM `Shortcut`')
          $view.Execute()
          $count = 0
          while ($record = $view.Fetch()) {
            if ($record.StringData(2) -ne '[#RayfishAppExe]') {
              throw "Shortcut $($record.StringData(1)) does not launch the app directly."
            }
            if ($record.StringData(3) -ne 'Rayfish.exe') {
              throw "Shortcut $($record.StringData(1)) is missing its icon."
            }
            $count++
          }
          if ($count -ne 2) { throw 'Expected a desktop and Start menu shortcut.' }
          $view.Close()

      - name: Test installed service IPC
        shell: pwsh
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: '1'
        run: |
          . (Join-Path $env:RUNNER_TEMP 'safe-diagnostics.ps1')
          $msiPath = Join-Path $env:RUNNER_TEMP 'ray-windows-x86_64.msi'
          $installLog = Join-Path $env:RUNNER_TEMP 'rayfish-install.log'
          $arguments = @('/i', "`"$msiPath`"", '/qn', '/norestart', '/L*v', "`"$installLog`"")
          try {
            $installation = Start-Process -FilePath msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($installation.ExitCode -notin @(0, 3010)) {
              throw "Installing the test MSI failed with exit code $($installation.ExitCode)."
            }
          } catch {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 80 | ConvertTo-SafeDiagnostic
            }
            throw (ConvertTo-SafeDiagnostic $_.Exception.Message)
          }
          $service = Get-Service -Name rayfish -ErrorAction Stop
          try {
            if ($service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Stopped) {
              if ($service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::StopPending) {
                $service.Stop()
              }
              $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Stopped, [TimeSpan]::FromSeconds(30))
            }
          } finally {
            $service.Dispose()
          }
          cargo test -q -p ray-windows --locked --target x86_64-pc-windows-msvc installed_service_smoke -- --ignored --test-threads=1 2>&1 | ConvertTo-SafeDiagnostic
          if ($LASTEXITCODE -ne 0) { throw 'The installed-service IPC smoke test failed.' }
          try {
            $adapter = Get-NetAdapter -Name 'rayfish' -ErrorAction Stop | Select-Object -First 1
            $route = Get-NetRoute -AddressFamily IPv6 -DestinationPrefix '200::/7' -InterfaceIndex $adapter.ifIndex -PolicyStore ActiveStore -ErrorAction Stop |
              Select-Object -First 1
          } catch {
            throw 'The installed service did not retain its tunnel and mesh route in standby.'
          }
          if ($adapter.Status -ne 'Up' -or -not $route) {
            throw 'The installed service did not retain its tunnel and mesh route in standby.'
          }

      - name: Collect service failure diagnostics
        if: failure()
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 3
        run: |
          . (Join-Path $env:RUNNER_TEMP 'safe-diagnostics.ps1')
          $diagnostics = Join-Path $env:RUNNER_TEMP 'windows-service-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          function Save-Diagnostic($name, [scriptblock]$read) {
            try {
              & $read | Out-String -Width 240 | ConvertTo-SafeDiagnostic | Tee-Object -FilePath (Join-Path $diagnostics "$name.txt")
            } catch {
              "${name}: $($_.Exception.Message)" | ConvertTo-SafeDiagnostic | Tee-Object -FilePath (Join-Path $diagnostics "$name.txt")
            }
          }
          Save-Diagnostic 'service' {
            Get-CimInstance Win32_Service -Filter "Name='rayfish'" -OperationTimeoutSec 15 |
              Select-Object Name, State, Status, StartMode, ProcessId, ExitCode, ServiceSpecificExitCode, PathName |
              Format-List
          }
          $since = (Get-Date).AddMinutes(-20)
          Save-Diagnostic 'service-events' {
            Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=$since} -MaxEvents 100 |
              Where-Object Message -Match 'rayfish' | Select-Object -First 20 TimeCreated, Id, LevelDisplayName, Message | Format-List
          }
          Save-Diagnostic 'application-events' {
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2,3; StartTime=$since} -MaxEvents 100 |
              Where-Object Message -Match 'rayfish|ray\.exe|wintun' | Select-Object -First 20 TimeCreated, Id, ProviderName, Message | Format-List
          }
          $logRoots = @(
            @{Name='system-profile'; Path=(Join-Path $env:WINDIR 'System32\config\systemprofile\AppData\Roaming\rayfish\logs')},
            @{Name='programdata'; Path=(Join-Path $env:PROGRAMDATA 'rayfish\logs')},
            @{Name='current-user'; Path=(Join-Path $env:APPDATA 'rayfish\logs')}
          )
          foreach ($root in $logRoots) {
            try {
              if (-not (Test-Path -LiteralPath $root.Path)) { continue }
              $destination = Join-Path $diagnostics $root.Name
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              $logs = Get-ChildItem -LiteralPath $root.Path -File |
                Where-Object { $_.Name -eq 'panic.log' -or $_.Name -like 'rayfish.log*' } |
                Sort-Object LastWriteTime -Descending | Select-Object -First 4
              foreach ($log in $logs) {
                $safeLog = Join-Path $destination "$($log.Name).txt"
                Get-Content -LiteralPath $log.FullName -Raw | ConvertTo-SafeDiagnostic | Set-Content -LiteralPath $safeLog
                Write-Output "$($root.Name)/$($log.Name)"
                Get-Content -LiteralPath $safeLog -Tail 120
              }
            } catch {
              $_.Exception.Message | ConvertTo-SafeDiagnostic | Write-Warning
            }
          }

      - name: Preserve compiled test bundle
        if: always()
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP 'safe-diagnostics.ps1')
          $bundle = Join-Path $env:RUNNER_TEMP 'windows-test-debug'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Get-Item -Path "$env:RUNNER_TEMP\ray-windows-x86_64.msi*", "$env:RUNNER_TEMP\windows-service-diagnostics" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $bundle -Recurse
          $installLog = Join-Path $env:RUNNER_TEMP 'rayfish-install.log'
          if (Test-Path -LiteralPath $installLog) {
            Get-Content -LiteralPath $installLog -Raw | ConvertTo-SafeDiagnostic |
              Set-Content -LiteralPath (Join-Path $bundle 'rayfish-install.txt')
          }
          $test = Get-ChildItem -Path 'target\x86_64-pc-windows-msvc\debug\deps\rayfish_app-*.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($test) { Copy-Item -LiteralPath $test.FullName -Destination (Join-Path $bundle 'smoke-test.exe') }
          @{sourceCommit=$env:GITHUB_SHA; sourceRunId=$env:GITHUB_RUN_ID; smokeTestPresent=[bool]$test} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'build.json')

      - name: Upload compiled test bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-debug
          path: ${{ runner.temp }}/windows-test-debug
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3

      - name: Upload test installer
        uses: actions/upload-artifact@v7
        with:
          name: ray-windows-x86_64-msi
          path: ${{ runner.temp }}/ray-windows-x86_64.msi*
          if-no-files-found: error
          retention-days: 7
