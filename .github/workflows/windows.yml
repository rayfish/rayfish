name: Windows

on:
  pull_request:
    # `labeled` so applying the packaging label below starts a run on its own,
    # without waiting for another push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-ci"
          cache-on-failure: true
      - name: Cross-target compile
        run: cargo check --locked --target x86_64-pc-windows-msvc --features desktop --bin ray
      - name: Host regression tests
        run: cargo test --workspace --locked
      - name: Windows contract tests
        run: cargo test --test windows_contracts --locked
      - name: Clippy quality gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Windows on ARM is its own target, not a variant of the x86_64 one: it has no
  # NEON-free fallback to hide behind and its C dependencies (ring, blake3) pick
  # different sources there, so a green x86_64 job says nothing about it. Built
  # natively on `windows-11-arm`, which is free for public repositories, because
  # cross-compiling this target needs an out-of-tree clang/lld toolchain to work
  # around MSVC headers that clang cannot parse.
  arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-arm64-ci"
          cache-on-failure: true
      - name: Build ray.exe
        run: cargo build --locked --release --target aarch64-pc-windows-msvc --features desktop --bin ray
      - name: Windows contract tests
        run: cargo test --test windows_contracts --locked
      # Unsigned, like the MSI the package job builds; signing happens on a tag.
      - name: Upload ray.exe
        uses: actions/upload-artifact@v4
        with:
          name: ray-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/ray.exe
          if-no-files-found: error

  package:
    # Half an hour of Windows runner for an installer nobody asked for, so it
    # is opt-in on pull requests: label one `windows-packaging` to get an MSI.
    # A label and not a configuration variable because `vars` is empty in a run
    # triggered by a pull request from a fork, which is where the port arrived
    # from; labels ride in the event payload and are readable there.
    if: ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'windows-packaging') }}
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-package"
          cache-on-failure: true
      - name: Install WiX 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw 'WiX candle.exe was not found after installation.'
          }
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI and sidecars
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'rayfish' | Select-Object -First 1).version
          ./scripts/build-windows-msi.ps1 -Version $version -ReleaseIdentity $version -Channel stable -OutputPath "$env:RUNNER_TEMP\ray-windows-x86_64.msi"
      # Unsigned on purpose. This job runs on pull requests, including from
      # forks, which cannot see the signing secrets. Signing happens in
      # release.yml, on a tag.
      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ray-windows-x86_64-msi
          path: ${{ runner.temp }}/ray-windows-x86_64.msi*
          if-no-files-found: error
