name: Windows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cross-target compile
        run: cargo check --target x86_64-pc-windows-msvc --features desktop --bin ray
      - name: Host regression tests
        run: cargo test --workspace --locked
      - name: Windows contract tests
        run: cargo test --test windows_contracts --locked
      - name: Clippy quality gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package:
    if: ${{ vars.RAYFISH_WINDOWS_PACKAGING == 'true' }}
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Download signed Wintun
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wintun') -Force
          New-Item -ItemType Directory -Force -Path packaging/windows/wintun/amd64 | Out-Null
          $dll = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wintun') -Recurse -Filter wintun.dll | Where-Object FullName -Match 'amd64' | Select-Object -First 1
          if (-not $dll) { throw 'amd64/wintun.dll not found in upstream archive' }
          Copy-Item $dll.FullName packaging/windows/wintun/amd64/wintun.dll
          ./scripts/verify-wintun.ps1 -ArchivePath $zip
      - name: Install WiX 3
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --features desktop --bin ray
      - name: Stage Wintun beside binary
        shell: pwsh
        run: Copy-Item packaging/windows/wintun/amd64/wintun.dll target/x86_64-pc-windows-msvc/release/wintun.dll
      - name: Build MSI
        run: cargo wix -p rayfish --no-build --target x86_64-pc-windows-msvc --target-bin-dir target/x86_64-pc-windows-msvc/release --output target/rayfish-windows-x64.msi
