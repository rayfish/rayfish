name: Rayfish
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
configs:
  Debug: debug
  LocalRelease: release
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.rayfish.app
    MARKETING_VERSION: "0.5.6"
    CURRENT_PROJECT_VERSION: "14"
    RAYFISH_APP_PROFILE: Rayfish
    RAYFISH_TUNNEL_PROFILE: "Rayfish tunnel"
    RAYFISH_UPDATE_FEED: ""
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    LocalRelease:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  Rayfish:
    type: application
    platform: macOS
    sources:
      - path: Rayfish/App
      - path: Rayfish/Assets.xcassets
      - path: Rayfish/Sparkle-LICENSE.txt
      - path: Rayfish/Fonts
        type: folder
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayfish.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Rayfish/Rayfish.entitlements
        INFOPLIST_FILE: Rayfish/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Rayfish/RayfishDevelopment.entitlements
        LocalRelease:
          CODE_SIGN_ENTITLEMENTS: Rayfish/RayfishDevelopment.entitlements
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(RAYFISH_APP_PROFILE)"
    dependencies:
      - package: Sparkle
      - sdk: UserNotifications.framework
      - target: RayfishTunnelExtension
        embed: true
    postBuildScripts:
      - name: Bundle the Rust ray command
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          cargo -q build --release --locked -p rayfish --bin ray --features macos-app
          destination="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/MacOS/ray"
          install -m 755 target/release/ray "$destination"
          helpers="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library/LaunchDaemons"
          mkdir -p "$helpers"
          install -m 644 macos/LaunchDaemons/com.rayfish.app.ssh.plist "$helpers/"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --options runtime --timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$destination"
          fi
  RayfishTunnelExtension:
    type: system-extension
    productName: com.rayfish.app.tunnel
    platform: macOS
    sources:
      - path: RayfishTunnelExtension
      - path: Shared
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayfish.app.tunnel
        PRODUCT_NAME: com.rayfish.app.tunnel
        PRODUCT_MODULE_NAME: RayfishTunnelExtension
        CODE_SIGN_ENTITLEMENTS: RayfishTunnelExtension/RayfishTunnelExtension.entitlements
        INFOPLIST_FILE: RayfishTunnelExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Generated"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/../target/release/libray_apple.a"
          - "-framework"
          - "SystemConfiguration"
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-fmodule-map-file=$(SRCROOT)/Generated/ray_appleFFI.modulemap"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: RayfishTunnelExtension/RayfishTunnelDevelopment.entitlements
        LocalRelease:
          CODE_SIGN_ENTITLEMENTS: RayfishTunnelExtension/RayfishTunnelDevelopment.entitlements
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(RAYFISH_TUNNEL_PROFILE)"
    preBuildScripts:
      - name: Build Rayfish Apple bridge
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          cargo -q build --release --locked -p ray-apple
